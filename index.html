<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendário de Cobranças</title>
<style>
:root{color-scheme:dark;--bg:#0a0c12;--card:#12151d;--card2:#181c27;--line:#232838;--tx:#eef0f6;--mut:#8a93a8;--ac:#6366f1;--ac2:#8b5cf6;--ok:#34d399;--dn:#60a5fa;--no:#f87171}
*{box-sizing:border-box;margin:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(900px 500px at 10% -10%,#1b1f4a55,transparent),radial-gradient(700px 400px at 100% 0,#3b1b5a40,transparent),var(--bg);color:var(--tx);min-height:100vh;padding:24px 16px}
.wrap{max-width:1120px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:16px;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
h1{font-size:1.6rem;font-weight:800;letter-spacing:-.02em}
h1 span{background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);font-size:.9rem;margin-top:4px;text-transform:capitalize}
.stats{display:flex;gap:10px;flex-wrap:wrap}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;min-width:108px}
.stat b{display:block;font-size:1.5rem;font-weight:800}
.stat small{color:var(--mut);font-size:.72rem;text-transform:uppercase;letter-spacing:.06em}
.main{display:grid;grid-template-columns:minmax(320px,480px) 1fr;gap:18px;align-items:start}
@media(max-width:860px){.main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 10px 30px #0006}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.bar h2{font-size:1.1rem;text-transform:capitalize;font-weight:700}
.nav{display:flex;gap:6px}
.btn{background:var(--card2);border:1px solid var(--line);color:var(--tx);border-radius:10px;padding:7px 12px;cursor:pointer;font-size:.85rem;transition:.15s}
.btn:hover{border-color:var(--ac);background:#1d2233}
.g{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{text-align:center;font-size:.68rem;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;padding:4px 0}
.d{position:relative;aspect-ratio:1/1.05;border-radius:12px;background:var(--card2);border:1px solid transparent;padding:7px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;transition:.15s;overflow:hidden}
.d:hover{border-color:#3a4160;transform:translateY(-1px)}
.d .n{font-size:.9rem;font-weight:600}
.d .c{font-size:.68rem;color:var(--ok);font-weight:700;text-align:right}
.d .p{position:absolute;left:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--ok),#2dd4bf);border-radius:0 3px 0 0}
.d.t .n{background:var(--ac);color:#fff;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:.8rem}
.d.s{background:linear-gradient(145deg,#2a2f6b,#3b2a72);border-color:var(--ac)}
.d.f{background:#141824}
.tabs{display:flex;gap:6px;background:var(--card2);padding:4px;border-radius:12px;margin:14px 0 10px}
.tab{flex:1;text-align:center;padding:8px 6px;border-radius:9px;cursor:pointer;font-size:.8rem;font-weight:600;color:var(--mut);transition:.15s}
.tab em{font-style:normal;opacity:.8;margin-left:4px}
.tab.on{background:var(--card);color:var(--tx);box-shadow:0 1px 6px #0006}
input{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font-size:.88rem;margin-bottom:10px;outline:none}
input:focus{border-color:var(--ac)}
.list{display:flex;flex-direction:column;gap:6px;max-height:56vh;overflow:auto;padding-right:2px}
.r{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card2);border:1px solid var(--line);border-left:3px solid var(--mut);border-radius:12px;padding:10px 12px}
.r.ok{border-left-color:var(--ok)}.r.dn{border-left-color:var(--dn)}.r.no{border-left-color:var(--no)}
.r b{font-size:.86rem;font-weight:600}
.r small{display:block;color:var(--mut);font-size:.74rem;margin-top:2px}
.a{border:0;border-radius:9px;padding:7px 12px;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap}
.a.ok{background:var(--ok);color:#052e1f}.a.dn{background:#243049;color:#bcd6ff}
.tag{font-size:.72rem;font-weight:700;color:var(--no);background:#3b1c20;padding:5px 9px;border-radius:8px;white-space:nowrap}
.empty{color:var(--mut);text-align:center;padding:26px;font-size:.88rem}
.r.fa{border-left-color:#f59e0b}
.a.fz{background:#f59e0b;color:#2b1a00}.a.gh{background:#232838;color:#c7cbe0}
.ic{background:var(--card2);border:1px solid var(--line);border-radius:9px;padding:6px 8px;cursor:pointer;color:var(--tx)}
.ic:hover{border-color:var(--ac)}
.bt{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.nt{margin-top:6px;font-size:.76rem;color:#fcd34d;background:#2a2412;border-radius:7px;padding:5px 8px;white-space:pre-wrap}
.md{position:fixed;inset:0;background:#000b;display:none;place-items:center;z-index:9;padding:12px}.md.on{display:grid}
.mc{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;width:min(440px,100%)}
.mc h3{font-size:.95rem;margin-bottom:10px}
textarea{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--tx);font:inherit;font-size:.88rem;outline:none;resize:vertical}
textarea:focus{border-color:var(--ac)}
.mb{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
</style>
</head>
<body>

 hoje.textContent=new Date().toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long",year:"numeric"});
